version: '3'

vars:
  BACKEND_DIR: ./backend
  FRONTEND_DIR: ./frontend

tasks:
  install:
    desc: 全依存関係をインストール
    cmds:
      - task: install:backend
      - task: install:frontend

  install:backend:
    desc: Python 依存関係をインストール (uv sync)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv sync --extra dev

  install:frontend:
    desc: Node 依存関係をインストール
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm install

  dev:
    desc: バックエンド + フロントエンドを同時起動
    deps:
      - dev:backend
      - dev:frontend

  dev:backend:
    desc: バックエンド開発サーバー起動 (port 8000)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run uvicorn app.main:app --reload --host 127.0.0.1 --port 8000

  dev:frontend:
    desc: フロントエンド開発サーバー起動 (port 5173)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npx vite --port 5173

  migrate:
    desc: DBマイグレーションを実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run alembic upgrade head

  migrate:create:
    desc: 新しいマイグレーションファイルを作成 (MESSAGE="変更内容" task migrate:create)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run alembic revision --autogenerate -m "{{.MESSAGE}}"
    vars:
      MESSAGE: '{{.MESSAGE | default "migration"}}'

  migrate:history:
    desc: マイグレーション履歴を表示
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run alembic history --verbose

  migrate:downgrade:
    desc: 1つ前のマイグレーションに戻す
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run alembic downgrade -1

  scan:
    desc: インデックス更新を手動実行 (CLI)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run python -m app.cli scan

  test:
    desc: 全テスト実行
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    desc: バックエンドテスト実行
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run pytest -v

  test:frontend:
    desc: フロントエンド型チェック
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npx tsc --noEmit

  lint:
    desc: 全 Lint 実行
    cmds:
      - task: lint:backend
      - task: lint:frontend

  lint:backend:
    desc: Python Lint
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  lint:frontend:
    desc: フロントエンド Lint
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npx eslint src/

  build:
    desc: フロントエンドビルド → バックエンドの static/ にコピー
    cmds:
      - task: build:frontend
      - mkdir -p {{.BACKEND_DIR}}/app/static
      - cp -r {{.FRONTEND_DIR}}/dist/* {{.BACKEND_DIR}}/app/static/

  build:frontend:
    desc: フロントエンドプロダクションビルド
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npx vite build

  start:
    desc: プロダクションモードで起動 (ビルド済みフロントエンドを配信)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run uvicorn app.main:app --host 127.0.0.1 --port 8000

  db:reset:
    desc: DB を削除して再作成 (migrate で再生成される)
    cmds:
      - rm -f ./data/doc-explore.db
      - task: migrate
